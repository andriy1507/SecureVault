name: Code Quality

on:
  pull_request:
    branches: [main]

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # SARIF upload -> inline PR annotations (needs code scanning)

jobs:
  lint:
    name: ktlint + detekt
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache lint tools
        uses: actions/cache@v4
        with:
          path: .lint-cache
          key: lint-tools-${{ hashFiles('scripts/lint.sh') }}

      - name: Run ktlint + detekt
        run: bash scripts/lint.sh

      - name: Upload ktlint SARIF
        if: always() && hashFiles('build/reports/lint/ktlint.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: build/reports/lint/ktlint.sarif
          category: ktlint

      - name: Upload detekt SARIF
        if: always() && hashFiles('build/reports/lint/detekt.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: build/reports/lint/detekt.sarif
          category: detekt

      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: build/reports/lint/
          retention-days: 7
